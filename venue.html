<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The venue — Andrea &amp; Maxim</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--blue:#6b9ab8;--blue-light:#a8c8de;--warm-white:#fff9f4;--text-dark:#2c2c2c;--text-mid:#5a5a5a}html,body{min-height:100%;background:#f7fbfd;color:var(--text-dark)}body{font-family:'Jost',sans-serif;font-weight:300}.venue-page{min-height:100vh;padding:32px 20px 56px;background:radial-gradient(circle at 50% 0%,#fff 0%,#f7fbfd 56%,#eef7fb 100%)}.back{display:inline-flex;align-items:center;gap:7px;color:var(--text-mid);text-decoration:none;font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:8px 0}.back::before{content:'←';font-size:15px;line-height:1}.venue{width:min(100%,1000px);margin:38px auto 0;text-align:center;animation:rise .8s ease both}.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--blue);margin-bottom:16px}h1{font-family:'Cormorant Garamond',serif;font-size:clamp(48px,9vw,76px);font-weight:300;font-style:italic;line-height:.95;margin-bottom:12px}.subtitle{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;color:var(--text-mid);line-height:1.45;margin:0 auto 25px;max-width:590px}.flourish{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--blue-light);font-size:13px;letter-spacing:5px;margin-bottom:30px}.flourish::before,.flourish::after{content:'';width:62px;height:1px;background:linear-gradient(to right,transparent,var(--blue-light))}.flourish::after{transform:scaleX(-1)}.gallery{display:grid;grid-template-columns:1.15fr .85fr;grid-template-rows:240px 240px;gap:12px;text-align:left}.photo{overflow:hidden;background:#dbe9f0;box-shadow:0 10px 28px rgba(83,123,146,.13)}.photo:first-child{grid-row:span 2}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .65s ease}.photo:hover img{transform:scale(1.045)}.details{max-width:630px;margin:38px auto 0;padding:27px 24px;background:rgba(255,249,244,.84);border:1px solid rgba(168,200,222,.7);box-shadow:0 10px 28px rgba(83,123,146,.08)}.details h2{font-family:'Cormorant Garamond',serif;font-size:31px;font-weight:400;font-style:italic;margin-bottom:7px}.details p{font-size:11px;letter-spacing:.12em;line-height:1.9;text-transform:uppercase;color:var(--text-mid)}.directions{display:inline-block;margin-top:17px;padding-bottom:3px;color:var(--blue);border-bottom:1px solid var(--blue-light);font-size:10px;letter-spacing:.18em;text-decoration:none;text-transform:uppercase;transition:color .2s}.directions:hover{color:var(--text-dark)}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@media(max-width:620px){.venue-page{padding:22px 14px 42px}.venue{margin-top:24px}.gallery{grid-template-columns:1fr 1fr;grid-template-rows:225px 150px 150px;gap:8px}.photo:first-child{grid-column:span 2;grid-row:auto}.details{margin-top:26px;padding:23px 16px}}
</style>
</head>
<body>
<main class="venue-page">
  <a class="back" id="back" href="index.html">Back to invitation</a>
  <section class="venue" aria-labelledby="venue-title">
    <p class="eyebrow">Andrea &amp; Maxim</p>
    <h1 id="venue-title">The venue</h1>
    <p class="subtitle" id="subtitle">We will celebrate at Restaurant h3, in the heart of downtown Montréal.</p>
    <div class="flourish">✦</div>
    <div class="gallery" aria-label="Restaurant h3 gallery">
      <figure class="photo"><img src="https://cache.marriott.com/content/dam/marriott-renditions/YULAK/yulak-restaurant-bar-2338-hor-wide.jpg?downsize=1336px:*&interpolation=progressive-bilinear&output-quality=70" alt="Restaurant h3 dining room" loading="eager"></figure>
      <figure class="photo"><img src="https://cache.marriott.com/content/dam/marriott-renditions/YULAK/yulak-restaurant-cellar-2337-hor-clsc.jpg?downsize=856px:*&interpolation=progressive-bilinear&output-quality=70" alt="Restaurant h3 wine cellar" loading="lazy"></figure>
      <figure class="photo"><img src="https://cache.marriott.com/is/image/marriotts7prod/ak-yulak-lifestyledec2022-0405-11175:Classic-Hor?fit=constrain&wid=856" alt="Restaurant h3 dining experience" loading="lazy"></figure>
      <figure class="photo"><img src="https://cache.marriott.com/is/image/marriotts7prod/ak-yulak-lifestyledec2022-0412-10622:Classic-Hor?fit=constrain&wid=856" alt="Wine tasting at Restaurant h3" loading="lazy"></figure>
    </div>
    <div class="details">
      <h2>Restaurant h3</h2>
      <p id="address">340 De La Gauchetière Ouest, 2nd Floor<br>Montréal, Québec</p>
      <a class="directions" id="directions" href="https://www.google.com/maps/search/?api=1&query=Restaurant+h3%2C+340+De+La+Gauchetiere+Ouest%2C+Montreal" target="_blank" rel="noopener">Get directions</a>
    </div>
  </section>
</main>
<script>
const french=new URLSearchParams(location.search).get('lang')==='fr';
if(french){document.documentElement.lang='fr';document.title='Le restaurant — Andrea & Maxim';document.getElementById('back').textContent='Retour à l’invitation';document.getElementById('venue-title').textContent='Le restaurant';document.getElementById('subtitle').textContent='Nous célébrerons au Restaurant h3, au cœur du centre-ville de Montréal.';document.getElementById('directions').textContent='Itinéraire';document.querySelector('.gallery').setAttribute('aria-label','Galerie du Restaurant h3');document.querySelectorAll('.photo img')[0].alt='Salle à manger du Restaurant h3';document.querySelectorAll('.photo img')[1].alt='Cellier du Restaurant h3';document.querySelectorAll('.photo img')[2].alt='Expérience gastronomique au Restaurant h3';document.querySelectorAll('.photo img')[3].alt='Dégustation de vins au Restaurant h3';}
</script>
</body>
</html>
