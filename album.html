<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Album</title><style>body{margin:0;background:#f7fbfd;color:#2c2c2c;font:16px Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:36px 18px;text-align:center}a{color:#6b9ab8}.rule{color:#c9a96e;margin:22px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:52px}.panel{max-width:560px;margin:25px auto 40px;padding:24px;background:#fff;border:1px solid #dce9f0;text-align:left}label{display:block;margin-top:15px;font-size:12px;text-transform:uppercase;letter-spacing:.08em}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:7px}button{border:0;background:#6b9ab8;color:#fff;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.pick{background:#6b9ab8;color:#fff;text-align:center;padding:13px;cursor:pointer}.pick input{display:none}#send{margin-top:30px;padding:17px;background:#4f86a8;font-size:12px;box-shadow:0 8px 18px #6b9ab833}.status{min-height:20px;text-align:center;color:#68737a}.error{color:#a95353}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#e8f1f5}.empty{grid-column:1/-1;color:#788}@media(max-width:560px){h1{font-size:40px}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><a href="index.html">← Back to our wedding</a><div class="rule">✦</div><h1>Our Wedding Album</h1><p>Share the moments you capture with Andrea &amp; Maxim. Photos appear after approval.</p><section class="panel"><h2>Share a photo</h2><form id="form"><label>Wedding passcode<input id="code" type="password" inputmode="numeric" required></label><label class="pick">Take a photo<input id="photoCamera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><label class="pick">Choose from album<input id="photoAlbum" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="send">Upload photo</button><p id="status" class="status"></p></form></section><h2>Shared memories</h2><div id="grid" class="grid"><p class="empty">Photos will appear here once approved.</p></div></main><script>const API="https://wedding-album.slabyrinto.workers.dev",g=document.getElementById("grid"),s=document.getElementById("status"),f=document.getElementById("form"),b=document.getElementById("send");async function load(){try{let r=await fetch(API+"/photos"),d=await r.json();g.innerHTML=d.photos&&d.photos.length?d.photos.map(p=>"<img src="+p.url+" alt=Wedding-memory>").join(""):"<p class=empty>Photos will appear here once approved.</p>"}catch(e){}}load();f.onsubmit=async e=>{e.preventDefault();let x=document.getElementById("photoCamera").files[0]||document.getElementById("photoAlbum").files[0];if(!x)return;if(x.size>12582912){s.textContent="Please choose a photo under 12 MB.";return}b.disabled=true;s.textContent="Uploading…";try{let r=await fetch(API+"/upload",{method:"POST",headers:{"Content-Type":x.type,"X-Wedding-Passcode":document.getElementById("code").value},body:x}),d=await r.json();if(!r.ok)throw Error(d.error);s.textContent=d.message;f.reset()}catch(e){s.textContent=e.message;s.className="status error"}b.disabled=false};</script></body></html>
