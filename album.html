</style></head><body><main class="wrap"><a href="index.html" id="back">← Back to our wedding</a><div class="rule">✦</div><h1 id="title">Our Wedding Album</h1><p id="intro">Share the moments you capture with Andrea &amp; Maxim. Photos appear after approval.</p><section class="panel"><h2 id="shareTitle">Share a photo</h2><form id="form"><label><span id="codeLabel">Wedding passcode</span><input id="code" type="password" inputmode="numeric" required></label><label class="pick"><span id="cameraLabel">Take a photo</span><input id="photoCamera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><label class="pick"><span id="albumLabel">Choose from album</span><input id="photoAlbum" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="previewWrap" class="preview" hidden><img id="previewImage" alt="Photo selected for upload"><p id="previewText">Photo ready to upload</p></div><button id="send">Upload photo</button><p id="status" class="status"></p></form></section><h2 id="memories">Shared memories</h2><div id="grid" class="grid"></div></main><script>
